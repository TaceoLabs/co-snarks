[package]
name = "taceo-mpc-net"
version = "0.5.0"
description = "Networking layer for the MPC protocols in co-snarks"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
exclude = ["data"]
publish = true
readme = "README.md"
keywords = ["mpc", "networking", "tls", "quic"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[lib]
name = "mpc_net"

[[example]]
name = "bench"
required-features = ["tcp"]

[[example]]
name = "three_party_tcp"
required-features = ["tcp"]

[[example]]
name = "three_party_tls"
required-features = ["tls"]

[[example]]
name = "three_party_quic"
required-features = ["quic"]

[dependencies]
byteorder = { workspace = true, optional = true }
bytes = { workspace = true }
crossbeam-channel = { version = "0.5.15", optional = true }
eyre.workspace = true
futures = { version = "0.3.30", optional = true }
humantime-serde = { version = "1.1.1", optional = true }
intmap = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
parking_lot = { version = "0.12.4", optional = true }
quinn = { version = "0.11", optional = true }
rustls = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
socket2 = { version = "0.6.5", optional = true }
tokio = { version = "1.48.0", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
], optional = true }
tokio-rustls = { version = "0.26", optional = true }
tokio-util = { version = "0.7.17", features = ["codec"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
toml.workspace = true
clap = { workspace = true }
color-eyre = { workspace = true }
rcgen = { workspace = true }
reserve-port = "2"
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
#
[features]
default = []
config = ["dep:humantime-serde", "dep:rustls", "dep:serde"]
local = ["dep:crossbeam-channel", "dep:intmap"]
quic = ["config", "dep:futures", "dep:parking_lot", "dep:quinn", "dep:tokio", "dep:tokio-util", "dep:tracing"]
tcp = ["config", "dep:byteorder", "dep:crossbeam-channel", "dep:intmap", "dep:itertools", "dep:socket2", "dep:tracing"]
tcp-session = ["config", "dep:futures", "dep:parking_lot", "dep:tokio", "dep:tokio-util", "dep:tracing"]
tcp-session-blocking = ["config", "dep:byteorder", "dep:crossbeam-channel", "dep:intmap", "dep:tracing"]
tls = ["config", "dep:byteorder", "dep:crossbeam-channel", "dep:intmap", "dep:itertools", "dep:socket2", "dep:tracing"]
tls-session = ["config", "dep:futures", "dep:parking_lot", "dep:tokio", "dep:tokio-rustls", "dep:tokio-util", "dep:tracing"]
tls-session-blocking = ["config", "dep:byteorder", "dep:crossbeam-channel", "dep:intmap", "dep:tracing"]
